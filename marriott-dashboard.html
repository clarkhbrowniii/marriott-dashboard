// SECTION 2 · FORMATTING UTILITIES

const finite = value => typeof value === 'number' && Number.isFinite(value);

const statusLabel = status => KPI_DATA.company.statusLabels[status] || 'Unclassified';
function formatKPIValue(metric,value) {
  if (!finite(value)) return 'Not available';
  const digits = metric.decimals ?? 1;
  if (metric.unit === 'usd') return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:digits,maximumFractionDigits:digits}).format(value);
  if (metric.unit === 'percent') return (metric.signedValues&&value>0?'+':'')+number(value,digits)+'%';

}

// SECTION 3 · KPI SUMMARY CALCULATIONS
function calculateKPIChange(metric) {
  const periods=periodsFor(metric), values=metric.values || [];
  const baselineIndex=periods.indexOf(metric.baselinePeriod);
  const baseline=baselineIndex < 0 ? null : values[baselineIndex];
  let latestIndex=-1;
  periods.forEach((_,i)=>{ if(finite(values[i])) latestIndex=i; });
  const latest=latestIndex<0?null:values[latestIndex];
  const comparable=finite(baseline)&&finite(latest)&&latestIndex>=baselineIndex;
  const absolute=comparable?latest-baseline:null;
  const relative=comparable&&baseline!==0?absolute/Math.abs(baseline)*100:null;
  const favorable=absolute===null||absolute===0||!['increase','decrease'].includes(metric.favorableDirection)?null:(metric.favorableDirection==='increase'?absolute>0:absolute<0);

}
function formatChange(metric,result) {
  if(result.absolute===null) return 'Comparison unavailable';
  const sign=result.absolute>0?'+':'';
  const mode=metric.comparison || (metric.unit==='percent'?'points':'absolute');
  if(mode==='points') return sign+number(result.absolute,metric.decimals??1)+' pp';
  if(mode==='relative') return result.relative===null?'Relative change unavailable':(result.relative>0?'+':'')+number(result.relative,metric.changeDecimals??1)+'%';
  return sign+formatKPIValue({...metric,signedValues:false},result.absolute)+(result.relative===null?'':' ('+(result.relative>0?'+':'')+number(result.relative,1)+'%)');
}

    const top=textElement('div','','card-top'); top.append(textElement('span',metric.classification,'classification'),textElement('span','· '+statusLabel(metric.status),'status'));

    chart.getDatasetMeta(0).data.forEach((element,index)=>{
      const value=chart.data.datasets[0].data[index]; if(!finite(value))return;
      const label=(metric.valueQualifiers?.[index]==='over'?'>':metric.valueQualifiers?.[index]==='nearly'?'≈':'')+(metric.unit==='millions'?number(value,metric.decimals??1):formatKPIValue(metric,value));
      ctx.fillText(label+(metric.valueStatuses?.[index]==='estimated'?' est.':''),element.x,element.y-9);
    }); ctx.restore();
  }};
}

// Inline vector icons keep the application standalone without an icon dependency.
function createIcon(name) {
  const paths={members:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M16 3a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.87 M13 7a4 4 0 1 1-8 0a4 4 0 0 1 8 0',link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2 M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2',phone:'M6 2h12v20H6z M10 18h4 M10 5h4',bars:'M3 21V14 M9 21V10 M15 21V6 M21 21V2',bed:'M2 20V5 M2 16h20v4 M2 10h20v6 M6 10V7h5v3 M13 10V7h7v3',coins:'M3 6c0-4 14-4 14 0s-14 4-14 0 M3 6v10c0 4 14 4 14 0V6 M3 11c0 4 14 4 14 0 M20 3v12 M20 3c0-2-5-3-9-2',bulb:'M9 18h6 M9 22h6 M8 15a7 7 0 1 1 8 0v3H8z M12 1V0 M2 7H0 M24 7h-2',target:'M21 12a9 9 0 1 1-9-9 M17 12a5 5 0 1 1-5-5 M12 12l10-10 M17 2h5v5',trend:'M2 18l7-7 5 4 8-11 M16 4h6v6'};
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('class','metric-icon'); svg.setAttribute('aria-hidden','true');
  const path=document.createElementNS('http://www.w3.org/2000/svg','path'); path.setAttribute('d',paths[name] || paths.trend); path.setAttribute('fill','none'); path.setAttribute('stroke','currentColor'); path.setAttribute('stroke-width','2'); path.setAttribute('stroke-linecap','round'); path.setAttribute('stroke-linejoin','round'); svg.append(path); return svg;
}
function renderInsights() {
  const container=document.getElementById('key-insights'); container.replaceChildren();
  (KPI_DATA.insights || []).forEach(insight=>{
    const panel=textElement('article','','insight-panel'),heading=textElement('h2'); heading.append(createIcon(insight.icon),document.createTextNode(insight.title)); panel.append(heading);
    if(insight.disclaimer)panel.append(textElement('p',insight.disclaimer,'insight-disclaimer'));
    const list=document.createElement(insight.numbered?'ol':'ul'); insight.items.forEach(item=>list.append(textElement('li',item))); panel.append(list); container.append(panel);
  });
}

// SECTION 6 · ANNOTATION FACTORY
function visibleInflections(metric) {
  return (metric.inflectionPoints || []).filter(point=>point&&point.display===true&&periodsFor(metric).includes(point.period)&&point.id&&point.title&&point.change&&point.cause);
}
function createInflectionAnnotations(metric) {
  return Object.fromEntries(visibleInflections(metric).map((point,index)=>[point.id,{type:'line',xMin:point.period,xMax:point.period,borderColor:'#843f50',borderWidth:1.5,borderDash:[5,5],label:{display:true,content:'FY'+point.period+' · '+(index+1),position:index%2?'end':'start',backgroundColor:'#843f50',color:'#fff',font:{size:chartFontSize(),weight:'normal'},padding:5},drawTime:'afterDatasetsDraw'}]));
}
function renderInflectionNotes(metric,panel) {
  const notes=textElement('div','','annotation-notes');
  visibleInflections(metric).forEach(point=>{
    const note=textElement('div','','annotation-note');
    note.append(textElement('strong','FY'+point.period+' → '+point.title),textElement('p','What changed → '+point.change),textElement('p','Likely cause → '+point.cause));
    const source=sourceFor(point.sourceId),evidence=textElement('p','Evidence: ','evidence');
    const link=sourceLink(source); evidence.append(link || document.createTextNode(source?source.name+' · '+statusLabel(source.status):'Pending supporting source'));
    note.append(evidence); notes.append(note);
  });
  if(notes.childElementCount) panel.append(notes);
}

// SECTION 7 · CHART RENDERER
const chartInstances=[];
function renderKPICharts() {
  chartInstances.forEach(chart=>chart.destroy()); chartInstances.length=0;
  document.getElementById('all-charts').replaceChildren();
  const annotationPlugin=globalThis['chartjs-plugin-annotation'];
  const librariesReady=typeof Chart!=='undefined'&&!!annotationPlugin;
  if(librariesReady) { Chart.defaults.font.size=chartFontSize(); Chart.register(annotationPlugin); }
  KPI_DATA.metrics.forEach((metric,index)=>{
    const panel=textElement('article','','chart-panel'+(metric.primary?' primary':'')); panel.dataset.metric=metric.id;
    const heading=textElement('div','','chart-heading'),titleGroup=textElement('div');
    const title=textElement('h3',metric.title); title.id='chart-title-'+index; titleGroup.append(title,textElement('p',metric.description));
    heading.append(createIcon(metric.icon),titleGroup,textElement('span',statusLabel(metric.status),'badge')); panel.append(heading);
    const periods=periodsFor(metric);
    panel.append(textElement('div',metric.unitLabel+' · '+periods.map(p=>'FY'+p).join(' / '),'chart-meta'));
    if(metric.supportingCharts?.length)panel.append(textElement('h4','Annual digital booking share — % of systemwide room nights'));
    const wrap=textElement('div','','canvas-wrap'),canvas=document.createElement('canvas'); canvas.setAttribute('role','img'); canvas.setAttribute('aria-labelledby',title.id); canvas.textContent=metric.title+'; exact values are available in the data table below.'; wrap.append(canvas); panel.append(wrap);
    document.getElementById('all-charts').append(panel);
    if(!(metric.values || []).some(finite)) {
      wrap.replaceChildren(textElement('p','Annual data not supplied. No values or dated inflection points are plotted. See Sources & methodology for the available documentation.','empty-chart'));
    }
    else if(librariesReady) { try { chartInstances.push(new Chart(canvas,createChartConfig(metric))); } catch(error) { wrap.replaceChildren(textElement('p','Unable to render chart: '+error.message,'error')); console.error(error); } }
    else { wrap.replaceChildren(textElement('p','Chart dependencies could not load. Connect to the internet and reload to display charts. Values and explanations remain available below.','error')); }
    if(metric.id==='digital_adoption') {
      const legend=textElement('div','','digital-legend');
      metric.doughnutLabels.forEach((label,i)=>{const item=textElement('span',metric.doughnutValues[i]+'% '+label); const swatch=textElement('span','','digital-swatch'); swatch.style.backgroundColor=metric.chart.colors[i]; swatch.setAttribute('aria-hidden','true'); item.prepend(swatch); legend.append(item);}); panel.append(legend);
    }
    renderInflectionNotes(metric,panel);
    (metric.notes || []).forEach(note=>panel.append(textElement('p',note,'metric-note')));
    renderSupportingCharts(metric,panel,librariesReady);
    const details=document.createElement('details'); details.append(textElement('summary',metric.contextObservations?.length?'View all KPI evidence, sources & classification':'View underlying values & data classification'));
    const table=document.createElement('table'),thead=document.createElement('thead'),headRow=document.createElement('tr'); ['Fiscal year',metric.unitLabel,'Classification'].forEach(label=>headRow.append(textElement('th',label))); thead.append(headRow); table.append(thead);
    const tbody=document.createElement('tbody'); periods.forEach((period,i)=>{const row=document.createElement('tr'); row.append(textElement('td','FY'+period),textElement('td',formatObservation(metric,metric.values?.[i],i)),textElement('td',finite(metric.values?.[i])?statusLabel(metric.valueStatuses?.[i] || metric.status):statusLabel('unavailable'))); tbody.append(row);}); table.append(tbody); details.append(table); renderContextObservations(metric,details); panel.append(details);
    if(metric.operatingIncome&&metric.totalRevenue) {
      const inputs=document.createElement('details');inputs.append(textElement('summary','View operating margin calculation inputs ('+metric.inputUnit+')'));
      const inputTable=document.createElement('table'),inputHead=document.createElement('tr');['Fiscal year','Operating income','Total revenue'].forEach(label=>inputHead.append(textElement('th',label)));inputTable.append(inputHead);
      periods.forEach((period,i)=>{const row=document.createElement('tr');row.append(textElement('td','FY'+period),textElement('td',number(metric.operatingIncome[i],0)),textElement('td',number(metric.totalRevenue[i],0)));inputTable.append(row);});inputs.append(inputTable);panel.append(inputs);
    }
  });
}

// Supporting measures use separate axes and units.
function renderSupportingCharts(metric,panel,librariesReady) {
  (metric.supportingCharts || []).forEach(supporting=>{
    panel.append(textElement('h4',supporting.title),textElement('p',supporting.description,'metric-note'));
    const wrap=textElement('div','','canvas-wrap'),canvas=document.createElement('canvas');
    const description=supporting.periods.map((period,i)=>'FY'+period+': '+formatObservation(supporting,supporting.values[i],i)+(supporting.valueStatuses?.[i]==='estimated'?' (est.)':'')).join(' · ');
    canvas.setAttribute('role','img');canvas.setAttribute('aria-label',supporting.title+'; '+description);wrap.append(canvas);panel.append(wrap);
    if(librariesReady)chartInstances.push(new Chart(canvas,createChartConfig(supporting)));
    else wrap.replaceChildren(textElement('p',description,'metric-note'));
  });
}

// Related evidence is kept separate when its measure or reporting window differs.
function renderContextObservations(metric,panel) {
  if(!(metric.contextObservations || []).length)return;
  const evidence=document.createElement('div'); evidence.append(textElement('h4','Supporting volume & growth observations'));
  metric.contextObservations.forEach(observation=>{
    const record=textElement('div','','annotation-note');
    record.append(textElement('strong',observation.period+' · '+observation.measure),textElement('p',observation.value),textElement('p','Change: '+observation.change),textElement('p','Classification: '+statusLabel(observation.status || metric.status)));
    const source=sourceFor(observation.sourceId),citation=textElement('p','Source: ');citation.append(sourceLink(source)||document.createTextNode(source?.name || 'Not supplied'));record.append(citation);evidence.append(record);
  });panel.append(evidence);
}

// SECTION 8 · SOURCE RENDERER
function renderSources() {
  const method=document.getElementById('methodology'); method.replaceChildren(...KPI_DATA.company.methodology.map(item=>textElement('p',item)));
  const container=document.getElementById('sources'); container.replaceChildren();
  KPI_DATA.metrics.forEach(metric=>{
    const row=textElement('div','','source-row'),name=textElement('div'); name.append(textElement('strong',metric.name),textElement('p',statusLabel(metric.status)));
    const content=document.createElement('div');
    if(!(metric.sources || []).length) content.append(textElement('p','Source not yet supplied.'));
    (metric.sources || []).forEach(id=>{
      const source=sourceFor(id); if(!source) {content.append(textElement('p','Source reference unavailable: '+id));return;}
      const line=textElement('p'); line.append(sourceLink(source) || document.createTextNode(source.name)); content.append(line,textElement('p','Publication / reporting date: '+(source.date || source.dateLabel || 'Not supplied')+' · '+statusLabel(source.status)),textElement('p','URL: '+(source.url || 'Not supplied in the resource document')));
      if(source.localPath)content.append(textElement('p','Supplied file: '+source.localPath));
      if(source.methodology) content.append(textElement('p','Methodology: '+source.methodology));
    });
    if(metric.estimationMethodology) content.append(textElement('p','KPI estimation method: '+metric.estimationMethodology));
    row.append(name,content); container.append(row);
  });
}

// SECTION 9 · INITIALIZATION
function initializeDashboard() {
  const company=KPI_DATA.company;
  document.title=company.name+' | '+company.title;
  [['company-name',company.name],['dashboard-title',company.title],['reporting-period','Fiscal Years '+KPI_DATA.periods[0]+' – '+KPI_DATA.periods.at(-1)],['thesis',company.thesis],['project-label',company.project],['footer-project',company.project],['banner-subtitle',company.bannerSubtitle],['brand-promise',company.brandPromise],['summary-heading',company.summaryTitle]].forEach(([id,value])=>document.getElementById(id).textContent=value);
  const statuses=KPI_DATA.metrics.flatMap(metric=>[metric.status,...(metric.valueStatuses || []),...(metric.sources || []).map(id=>sourceFor(id)?.status),...visibleInflections(metric).map(point=>sourceFor(point.sourceId)?.status)]).filter(Boolean);
  const distinct=[...new Set(statuses)];
  const status=statuses.includes('placeholder')?'placeholder':distinct.length===1?distinct[0]:distinct.length?'mixed':company.dataStatus==='illustrative'?'placeholder':company.dataStatus;
  const notice=document.getElementById('data-notice'); notice.dataset.status=status; notice.textContent=company.statusNotices[status] || 'Data Classification | Review Sources';
  document.getElementById('footer-status').textContent=notice.textContent;
  renderKPICards(); renderKPICharts(); renderInsights(); renderSources();
}
document.addEventListener('DOMContentLoaded',initializeDashboard);
document.querySelectorAll('.nav-links a').forEach(link=>link.addEventListener('click',()=>{
  document.querySelectorAll('.nav-links a').forEach(item=>item.classList.remove('active')); link.classList.add('active');
}));
</script>
